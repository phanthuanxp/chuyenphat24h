name: Migrate production storage to PostgreSQL

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_TO_POSTGRES to continue
        required: true
        type: string

concurrency:
  group: chuyenphat24h-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Backup JSON and migrate PostgreSQL
    if: inputs.confirmation == 'MIGRATE_TO_POSTGRES'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /var/www/chuyenphat24h
      APP_NAME: chuyenphat24h
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Migrate production storage
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' bash '$APP_DIR/deploy/migrate-json-to-postgres.sh'"

      - name: Verify public health
        run: |
          payload="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 https://chuyenphat24h.com/api/health)"
          printf '%s\n' "$payload"
          printf '%s' "$payload" | grep -q '"storage":"postgres"'
